name: comic_center
description: A manga and manhwa reading app with an immersive iOS-native design.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Local database
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  path_provider: ^2.1.3

  # Networking
  dio: ^5.4.3

  # HTML parsing for web-based extensions
  html: ^0.15.4

  # Image loading & reader canvas
  cached_network_image: ^3.3.1
  extended_image: ^8.3.0

  # Immutable data models
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0

  # Backup / archive
  archive: ^3.6.1

  # HTTP client (required by googleapis AuthClient)
  http: ^1.2.0

  # Google Drive sync
  googleapis: ^12.0.0
  googleapis_auth: ^1.6.0
  google_sign_in: ^6.2.1
  http: ^1.2.0

  # Icons
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.12
  isar_generator: ^3.1.0+1
  riverpod_generator: ^2.4.0
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  # riverpod_lint and custom_lint removed — incompatible with isar_generator's
  # analyzer version constraint. Add back once Isar 4.x ships.

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
