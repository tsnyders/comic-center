name: comic_center
description: A manga and manhwa reading app with an immersive iOS-native design.
publish_to: 'none'
version: 1.0.0+3

environment:
  sdk: '>=3.6.2 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Local database
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  path_provider: ^2.1.3

  # Networking
  dio: ^5.4.3

  # HTML parsing for web-based extensions
  html: ^0.15.4

  # Image loading & reader canvas
  cached_network_image: ^3.3.1
  extended_image: ^8.3.0

  # LUMEN — extract a dominant accent colour from each cover ("let art decide")
  palette_generator: ^0.3.3

  # Immutable data models
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0

  # Backup / archive
  archive: ^3.6.1

  # Google Drive sync
  googleapis: ^12.0.0
  googleapis_auth: ^1.6.0
  google_sign_in: ^6.2.1
  http: ^1.2.0

  # Reader screen brightness control
  screen_brightness: ^1.0.1

  # App version info (for update comparison)
  package_info_plus: ^8.0.0

  # Persisted settings (theme, reader prefs, etc.)
  shared_preferences: ^2.2.0

  # Icons
  cupertino_icons: ^1.0.6

  # Cross-platform URL opening (replaces the Android-only intent channel)
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.12
  isar_generator: ^3.1.0+1
  riverpod_generator: ^2.4.0
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  # riverpod_lint and custom_lint removed — incompatible with isar_generator's
  # analyzer version constraint. Add back once Isar 4.x ships.

# ── Native splash / launch screen ────────────────────────────────────────────
# The launch screen assets (ios/Runner/.../LaunchImage* + LaunchScreen.storyboard,
# android launch_background drawables) are already generated and committed, so
# the generator package is NOT a build dependency (it broke Swift Package Manager
# resolution as a dev_dependency). To regenerate after changing the logo/colour,
# temporarily add `flutter_native_splash: ^2.4.1` to dev_dependencies and run
# `dart run flutter_native_splash:create`, then remove it again.
flutter_native_splash:
  color: "#0A0A0F"            # ink background (matches AppColors.background)
  image: assets/branding/yomi_logo.png
  color_dark: "#0A0A0F"
  image_dark: assets/branding/yomi_logo.png
  android_12:
    color: "#0A0A0F"
    image: assets/branding/yomi_logo.png
    color_dark: "#0A0A0F"
    image_dark: assets/branding/yomi_logo.png
  ios: true
  android: true
  web: false

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/branding/

  # "Obsidian" type system — three tiers:
  #   Tier 1: Cormorant Garamond (variable) — editorial display / hero titles
  #   Tier 2: Sora (variable) — UI chrome, labels, buttons, nav
  #   Tier 3: system Roboto / SF Pro — body prose, captions (no declaration needed)
  # Poppins retained for back-compat with any remaining call sites.
  fonts:
    # LUMEN design system:
    #   HankenGrotesk (variable) — display + UI, weight via FontVariation('wght')
    #   SpaceMono — metadata, numbers, technical labels
    - family: HankenGrotesk
      fonts:
        - asset: assets/fonts/HankenGrotesk.ttf
    - family: SpaceMono
      fonts:
        - asset: assets/fonts/SpaceMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/SpaceMono-Bold.ttf
          weight: 700

    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf

    - family: CormorantGaramond
      fonts:
        - asset: assets/fonts/CormorantGaramond.ttf

    - family: Sora
      fonts:
        - asset: assets/fonts/Sora.ttf

    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
