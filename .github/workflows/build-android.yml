name: Build Yomi Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.gitignore'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # needed for auto release notes

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: 'stable'

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_FILE }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/yomi-release.jks

      - name: Write key.properties
        run: |
          cat > android/key.properties << 'EOF'
          storeFile=yomi-release.jks
          storePassword=${{ secrets.KEYSTORE_STORE_PASSWORD }}
          keyAlias=${{ secrets.KEYSTORE_KEY_ALIAS }}
          keyPassword=${{ secrets.KEYSTORE_KEY_PASSWORD }}
          EOF

      - name: Decode google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          echo "$GOOGLE_SERVICES_JSON" | base64 --decode > android/app/google-services.json

      - name: Flutter pub get
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Verify APK exists and rename
        run: |
          set -e
          echo "── Build output tree ──"
          ls -la build/app/outputs/flutter-apk/ || true
          APK=build/app/outputs/flutter-apk/app-release.apk
          if [ ! -f "$APK" ]; then
            echo "::error::APK not found at $APK"
            find build -name "*.apk" -ls
            exit 1
          fi
          cp "$APK" yomi-release.apk
          echo "APK size: $(du -h yomi-release.apk)"

      - name: Generate release tag
        id: tag
        run: echo "tag=v1.0.0-beta.$(date +'%Y%m%d-%H%M')" >> $GITHUB_OUTPUT

      - name: Build install instructions
        id: install
        run: |
          cat >> $GITHUB_OUTPUT << 'INSTALL'
          body<<EOF
          ## Install
          1. Download **yomi-release.apk** below
          2. On your Android device: Settings → Apps → Special permissions → Install unknown apps
          3. Open the downloaded APK and tap **Install**
          EOF
          INSTALL

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "Yomi ${{ steps.tag.outputs.tag }}"
          body: ${{ steps.install.outputs.body }}
          generate_release_notes: true
          files: yomi-release.apk
          prerelease: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
