name: Build Yomi Android APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/manga-app-architecture-design-Rg8CN

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: 'stable'

      - name: Flutter pub get
        run: flutter pub get

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Verify APK exists and rename
        run: |
          set -e
          echo "── Build output tree ──"
          ls -la build/app/outputs/flutter-apk/ || true
          APK=build/app/outputs/flutter-apk/app-debug.apk
          if [ ! -f "$APK" ]; then
            echo "::error::APK not found at $APK"
            find build -name "*.apk" -ls
            exit 1
          fi
          cp "$APK" yomi-debug.apk
          echo "APK size: $(du -h yomi-debug.apk)"

      - name: Generate release tag
        id: tag
        run: echo "tag=v1.0.0-beta.$(date +'%Y%m%d-%H%M')" >> $GITHUB_OUTPUT

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Yomi ${{ steps.tag.outputs.tag }}
          body: |
            ## Yomi — Beta Build

            Android APK for testing.

            ### Install
            1. Download **yomi-debug.apk** below
            2. On your Android device, allow installs from unknown sources
               (Settings → Apps → Special permissions → Install unknown apps)
            3. Open the downloaded APK and tap Install

            ### What's included
            - MangaDex, AllManga, AsuraScans sources
            - Glassmorphism UI with floating glass nav bar
            - Dark and Light mode (Settings → Appearance)
            - Library, Downloads, Reader with chapter sync

            > Debug build for testing.
          files: yomi-debug.apk
          prerelease: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
