name: Build Yomi Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.gitignore'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: 'stable'

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_FILE }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/yomi-release.jks

      - name: Write key.properties
        run: |
          cat > android/key.properties << 'EOF'
          storeFile=yomi-release.jks
          storePassword=${{ secrets.KEYSTORE_STORE_PASSWORD }}
          keyAlias=${{ secrets.KEYSTORE_KEY_ALIAS }}
          keyPassword=${{ secrets.KEYSTORE_KEY_PASSWORD }}
          EOF

      - name: Decode google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          echo "$GOOGLE_SERVICES_JSON" | base64 --decode > android/app/google-services.json

      - name: Flutter pub get
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Verify APK exists and rename
        run: |
          set -e
          APK=build/app/outputs/flutter-apk/app-release.apk
          if [ ! -f "$APK" ]; then
            echo "::error::APK not found at $APK"
            find build -name "*.apk" -ls
            exit 1
          fi
          cp "$APK" yomi-beta.apk
          echo "APK size: $(du -h yomi-beta.apk)"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0-beta.${{ github.run_number }}"
          name: "Yomi Beta 1.0 (Build ${{ github.run_number }})"
          body: |
            ## What's new
            See the commit history below for changes in this build.

            ## Install
            1. Download **yomi-beta.apk** below
            2. On your Android device: Settings → Apps → Special permissions → Install unknown apps
            3. Open the downloaded APK and tap **Install**

            > This is a beta build. Use the in-app **What's New** section to update automatically.
          generate_release_notes: true
          files: yomi-beta.apk
          prerelease: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
