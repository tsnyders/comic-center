name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: write  # needed to create releases and upload assets

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/manga-app-architecture-design-Rg8CN

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: 'stable'

      - name: Flutter pub get
        run: flutter pub get

      - name: Build debug APK
        run: flutter build apk --debug 2>&1 | tee build_output.txt

      - name: Generate release tag
        id: tag
        run: echo "tag=v1.0.0-beta.$(date +'%Y%m%d-%H%M')" >> $GITHUB_OUTPUT

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "Comic Center ${{ steps.tag.outputs.tag }}"
          body: |
            ## Comic Center — Beta Build

            Android APK for testing. Install by:
            1. Download `comic-center-debug.apk` below
            2. On your Android device, allow installs from unknown sources (Settings → Security)
            3. Open the downloaded APK and install

            ### What's included
            - MangaDex, AllManga, AsuraScans sources
            - Glassmorphism UI with floating glass nav bar
            - Dark and Light mode (Settings → Appearance)
            - Library, Downloads, Reader with chapter sync

            > ⚠️ This is a debug/beta build for testing purposes.
          files: build/app/outputs/flutter-apk/app-debug.apk
          prerelease: true
          make_latest: true
