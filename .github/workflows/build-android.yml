name: Build Yomi

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.gitignore'

permissions:
  contents: write

jobs:
  # ── Create the release stub first so both build jobs can upload to it ──────
  create-release:
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.tag.outputs.tag_name }}
    steps:
      - name: Set tag
        id: tag
        run: echo "tag_name=v1.0-beta.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      # Full history + tags so the changelog can diff against the previous release
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Turn the commits since the last release tag into a bullet list. This
      # becomes the "What's new" section shown both on the release page and in
      # the app's What's New dialog (which fetches the release body).
      - name: Build changelog from commits
        id: changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            RANGE="$PREV_TAG..HEAD"
            echo "Previous release: $PREV_TAG"
          else
            RANGE="HEAD"
            echo "No previous tag found — listing recent commits"
          fi
          NOTES=$(git log "$RANGE" --no-merges --pretty=format:'- %s' | head -30)
          if [ -z "$NOTES" ]; then
            NOTES="- Maintenance build (no code changes since the previous release)."
          fi
          {
            echo "notes<<NOTES_EOF"
            echo "$NOTES"
            echo "NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0-beta.${{ github.run_number }}"
          name: "Yomi Beta 1.0 (Build ${{ github.run_number }})"
          body: |
            ## What's new
            ${{ steps.changelog.outputs.notes }}

            ---

            ## Install — Android
            1. Download **yomi-beta.apk** below.
            2. On your device: **Settings → Apps → Special permissions → Install unknown apps**.
            3. Open the APK and tap **Install**.

            ## Install — iOS (sideload)
            1. Download **yomi-beta.ipa** below.
            2. Install with [AltStore](https://altstore.io) or [Sideloadly](https://sideloadly.io).

            > **Note:** This is an unsigned IPA built without Apple codesigning.
            > A free Apple ID lets you sideload it, but you'll need to re-sign every 7 days.
            > A paid Apple Developer account removes that limit.
          generate_release_notes: true
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Android ──────────────────────────────────────────────────────────────────
  build-android:
    runs-on: ubuntu-latest
    needs: create-release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: 'stable'

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_FILE }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > android/app/yomi-release.jks

      - name: Write key.properties
        run: |
          cat > android/key.properties << 'EOF'
          storeFile=yomi-release.jks
          storePassword=${{ secrets.KEYSTORE_STORE_PASSWORD }}
          keyAlias=${{ secrets.KEYSTORE_KEY_ALIAS }}
          keyPassword=${{ secrets.KEYSTORE_KEY_PASSWORD }}
          EOF

      - name: Decode google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: echo "$GOOGLE_SERVICES_JSON" | base64 --decode > android/app/google-services.json

      - name: Flutter pub get
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Verify and rename APK
        run: |
          set -e
          APK=build/app/outputs/flutter-apk/app-release.apk
          if [ ! -f "$APK" ]; then
            echo "::error::APK not found at $APK"
            find build -name "*.apk" -ls
            exit 1
          fi
          cp "$APK" yomi-beta.apk
          echo "APK size: $(du -h yomi-beta.apk)"

      - name: Upload APK to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.create-release.outputs.tag_name }}
          files: yomi-beta.apk
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── iOS ───────────────────────────────────────────────────────────────────────
  build-ios:
    runs-on: macos-latest
    needs: create-release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: 'stable'

      - name: Flutter pub get
        run: flutter pub get

      - name: Generate iOS platform files
        run: flutter create --platforms=ios --org com.comiccenter .

      - name: Build iOS (no codesign)
        run: flutter build ios --release --no-codesign

      - name: Package unsigned IPA
        run: |
          set -e
          APP=build/ios/iphoneos/Runner.app
          if [ ! -d "$APP" ]; then
            echo "::error::Runner.app not found at $APP"
            find build -name "*.app" -maxdepth 5
            exit 1
          fi
          mkdir -p Payload
          cp -r "$APP" Payload/
          zip -r yomi-beta.ipa Payload/
          echo "IPA size: $(du -h yomi-beta.ipa)"

      - name: Upload IPA to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.create-release.outputs.tag_name }}
          files: yomi-beta.ipa
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
