name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/manga-app-architecture-design-Rg8CN

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973"
          yes | sdkmanager --licenses || true

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: 'stable'

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Flutter pub get
        run: flutter pub get

      - name: Build debug APK
        id: build_apk
        run: flutter build apk --debug 2>&1 | tee build_output.txt
        continue-on-error: true

      - name: Show last 100 lines of build output
        if: steps.build_apk.outcome == 'failure'
        run: tail -100 build_output.txt

      - name: Upload build output on failure
        if: steps.build_apk.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-logs
          path: build_output.txt
          retention-days: 3

      - name: Fail if build failed
        if: steps.build_apk.outcome == 'failure'
        run: exit 1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: comic-center-android
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
